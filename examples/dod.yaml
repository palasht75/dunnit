# Example dunnit contract showing every option.
# Most projects need only `checks:` — the rest has sane defaults.
version: 1

base: origin/main        # git ref to diff against; default HEAD (uncommitted work)

checks:                  # proof commands; each must exit 0
  - name: tests
    run: pytest -q
    timeout: 600         # seconds (default 600)
  - name: lint
    run: ruff check .
  - name: frontend-tests
    run: npm test --silent
    dir: frontend        # working directory relative to the repo root
    env: { CI: "1" }     # extra environment variables

protected:               # touching these fails verification (default: [dod.yaml])
  - dod.yaml
  - .github/**

require:                 # the work must actually be present
  changed: [tests/**]    # "done" includes a new or updated test
  non_empty_diff: true   # an empty diff is not a completed task

tamper: true             # deleted/skipped/focused tests, weakened assertions, config gaming
stubs: true              # warn on TODOs / stubbed code / suppressions in the diff
strict: false            # true: promote those warnings to failures
