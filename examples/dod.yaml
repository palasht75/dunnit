# Complete contract v2 example. Copy only requirements your repository owns.
version: 2

# Local default. CI should override this with the event's immutable base SHA.
base: origin/main

checks:
  # argv bypasses the shell and is the portable default.
  - name: tests
    argv: ["python", "-m", "pytest", "-q"]
    timeout: 600
    dir: "."
    env: {CI: "1"}
    writes: []

  # Use run only when a shell feature is intentional.
  - name: distribution
    run: "python -m build && python -m twine check dist/*"
    timeout: 300
    writes:
      - build/**
      - dist/**

protected:
  - dod.yaml
  - .github/**
  - pytest.ini

test_globs:
  - tests/**
  - "**/test_*.py"
  - "**/*_test.py"

require:
  non_empty_diff: true

tamper: true
stubs: true
strict: false
