name: Adoption question
description: Ask a focused, non-sensitive question about modeling or deploying a contract.
title: "question: "
body:
  - type: input
    id: version
    attributes:
      label: Dunnit version
      placeholder: "1.0.0a1"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Adoption stage
      options:
        - Evaluating locally
        - GitHub shadow mode
        - GitHub required check
        - Another CI system
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question and relevant sanitized configuration
      description: Do not include source code, command output, remotes, credentials, or personal data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no secrets, private source, repository remote, or personal data.
          required: true
