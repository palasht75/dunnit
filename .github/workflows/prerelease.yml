name: python-prerelease

"on":
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-315:
    name: Python 3.15 prerelease (allowed failure)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the newest Python 3.15 prerelease
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
          check-latest: true

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests and lint
        run: |
          python -m pytest -q
          python -m ruff check src tests benchmarks/aggregate.py
          python -m mypy src benchmarks/aggregate.py
