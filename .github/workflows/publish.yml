# Publish a GitHub release whose tag exactly matches the package version, such
# as v1.0.0a1. PyPI Trusted Publishing must authorize this workflow/environment.
name: publish

"on":
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install release and verification tooling
        run: python -m pip install -e ".[dev]"

      - name: Require the release tag to match package metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          with open("pyproject.toml", "rb") as stream:
              config = tomllib.load(stream)
          source = Path(config["tool"]["hatch"]["version"]["path"])
          match = re.search(
              r'^__version__\s*=\s*["\']([^"\']+)["\']\s*$',
              source.read_text(encoding="utf-8"),
              flags=re.MULTILINE,
          )
          if match is None:
              raise SystemExit(f"could not read a static __version__ assignment from {source}")
          version = match.group(1)
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(
                  f"release tag {os.environ['RELEASE_TAG']!r} does not match {expected!r}"
              )
          PY

      - name: Self-verify the release tag
        run: dunnit verify

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Clean-install and smoke-test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/release-wheel"
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/release-wheel/bin/dunnit" --version
          "$RUNNER_TEMP/release-wheel/bin/dunnit" --help
          "$RUNNER_TEMP/release-wheel/bin/python" -c "from importlib.resources import files; assert (files('dunnit') / 'dod-v2.schema.json').is_file()"

      - name: Clean-install and smoke-test the source distribution
        run: |
          python -m venv "$RUNNER_TEMP/release-sdist"
          "$RUNNER_TEMP/release-sdist/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/release-sdist/bin/dunnit" --version
          "$RUNNER_TEMP/release-sdist/bin/dunnit" doctor --help
          "$RUNNER_TEMP/release-sdist/bin/python" -c "from importlib.resources import files; assert (files('dunnit') / 'dod-v2.schema.json').is_file()"

      - name: Retain distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
