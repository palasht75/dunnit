# dunnit verifies dunnit. Run `dunnit verify` before claiming done.
version: 2
checks:
  - name: tests
    argv: [python, -m, pytest, -q]
    timeout: 600
    dir: .
    env: {CI: "1"}
    writes: []
  - name: lint
    argv: [python, -m, ruff, check, src, tests, benchmarks/aggregate.py]
    timeout: 600
    dir: .
    env: {CI: "1"}
    writes: []
protected:
  - dod.yaml
  - .github/**
test_globs:
  - tests/**
  - "**/test_*.py"
tamper: true
stubs: true
strict: false
